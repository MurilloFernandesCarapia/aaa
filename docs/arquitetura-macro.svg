<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1280" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <!-- ============================================================
       OrbitalGuard API - Arquitetura Macro em Nuvem (Azure)
       Estilo limpo / vertical - GS DevOps Tools & Cloud Computing
       ============================================================ -->

  <defs>
    <!-- Marcadores de seta -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3F4756"/>
    </marker>
  </defs>

  <!-- Fundo -->
  <rect width="820" height="1280" fill="#E8E9EC"/>

  <!-- =========================================================
       Título
       ========================================================= -->
  <text x="410" y="42" fill="#1B2330" font-size="22" font-weight="700" text-anchor="middle">
    OrbitalGuard - Arquitetura Macro em Nuvem (Azure)
  </text>
  <text x="410" y="68" fill="#5B6678" font-size="13" font-style="italic" text-anchor="middle">
    Fluxo: Usuário externo → Internet → Azure → VM Linux → Containers Docker → Banco persistido em Volume
  </text>

  <!-- =========================================================
       1. Usuário externo
       ========================================================= -->
  <g transform="translate(245,98)">
    <rect width="330" height="76" rx="10" fill="#D9E5F4" stroke="#7592B8" stroke-width="1.6"/>
    <!-- Ícone usuário -->
    <circle cx="40" cy="38" r="20" fill="#7592B8"/>
    <circle cx="40" cy="32" r="7" fill="#FFFFFF"/>
    <path d="M 26 50 Q 40 40 54 50 L 54 56 L 26 56 Z" fill="#FFFFFF"/>
    <text x="80" y="28" fill="#1B2330" font-size="13" font-weight="700">Usuário externo</text>
    <text x="80" y="46" fill="#3F4756" font-size="11">Aluno / Professor / Banca avaliadora</text>
    <text x="80" y="62" fill="#3F4756" font-size="11">Acessa via navegador, Postman ou curl</text>
  </g>

  <!-- Seta 1: Usuário → Internet -->
  <g stroke="#3F4756" stroke-width="2.4" fill="none" marker-end="url(#arrow)">
    <line x1="410" y1="174" x2="410" y2="208"/>
  </g>
  <text x="418" y="195" fill="#1B2330" font-size="11" font-weight="700">HTTP :8080</text>

  <!-- =========================================================
       2. Internet pública (elipse)
       ========================================================= -->
  <g transform="translate(295,210)">
    <ellipse cx="115" cy="32" rx="115" ry="32" fill="#C5CDD9" stroke="#5B6678" stroke-width="1.4"/>
    <text x="115" y="28" fill="#1B2330" font-size="13" font-weight="700" text-anchor="middle">🌐 Internet pública</text>
    <text x="115" y="46" fill="#3F4756" font-size="10" text-anchor="middle">Tráfego TCP/IP</text>
  </g>

  <!-- Seta 2: Internet → Azure -->
  <g stroke="#3F4756" stroke-width="2.4" fill="none" marker-end="url(#arrow)">
    <line x1="410" y1="276" x2="410" y2="306"/>
  </g>

  <!-- =========================================================
       3. Microsoft Azure (caixa grande)
       ========================================================= -->
  <g transform="translate(40,308)">
    <rect width="740" height="820" rx="14" fill="#D9E5F4" stroke="#3B7FC9" stroke-width="2"/>
    <text x="20" y="30" fill="#1B5B9E" font-size="15" font-weight="700">☁ Microsoft Azure - Region: brazilsouth</text>
    <text x="20" y="50" fill="#3F4756" font-size="11" font-style="italic">Resource Group: rg-orbitalguard-gs</text>

    <!-- =========================================================
         3.1 NSG (firewall) - caixa tracejada laranja
         ========================================================= -->
    <g transform="translate(80,70)">
      <rect width="580" height="92" rx="10" fill="none" stroke="#D08A2A" stroke-width="1.8" stroke-dasharray="7 5"/>
      <text x="14" y="22" fill="#8A5A14" font-size="13" font-weight="700">🛡 Network Security Group (NSG) - Firewall da VM</text>

      <!-- Porta 22 SSH -->
      <g transform="translate(20,38)">
        <rect width="170" height="42" rx="8" fill="#E8F4DD" stroke="#5DA84B" stroke-width="1.4"/>
        <text x="85" y="20" fill="#2F6A23" font-size="12" font-weight="700" text-anchor="middle">🔒 22 SSH</text>
        <text x="85" y="34" fill="#3F4756" font-size="10" text-anchor="middle">Acesso administrativo</text>
      </g>

      <!-- Porta 8080 API -->
      <g transform="translate(205,38)">
        <rect width="170" height="42" rx="8" fill="#E8F4DD" stroke="#5DA84B" stroke-width="1.4"/>
        <text x="85" y="20" fill="#2F6A23" font-size="12" font-weight="700" text-anchor="middle">🌐 8080 API / Swagger</text>
        <text x="85" y="34" fill="#3F4756" font-size="10" text-anchor="middle">Aplicação .NET</text>
      </g>

      <!-- Porta 1521 Oracle -->
      <g transform="translate(390,38)">
        <rect width="170" height="42" rx="8" fill="#E8F4DD" stroke="#5DA84B" stroke-width="1.4"/>
        <text x="85" y="20" fill="#2F6A23" font-size="12" font-weight="700" text-anchor="middle">🛢 1521 Oracle</text>
        <text x="85" y="34" fill="#3F4756" font-size="10" text-anchor="middle">Acesso ao banco</text>
      </g>
    </g>

    <!-- Seta NSG → VM -->
    <g stroke="#3F4756" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
      <line x1="370" y1="162" x2="370" y2="192"/>
    </g>
    <text x="378" y="182" fill="#1B2330" font-size="11" font-style="italic">tráfego permitido</text>

    <!-- =========================================================
         3.2 Azure VM
         ========================================================= -->
    <g transform="translate(40,196)">
      <rect width="660" height="600" rx="12" fill="#EAF1F9" stroke="#3B7FC9" stroke-width="1.8"/>
      <text x="16" y="26" fill="#1B5B9E" font-size="14" font-weight="700">💻 Azure VM - vm-orbitalguard-rm564969</text>
      <text x="16" y="44" fill="#3F4756" font-size="11" font-style="italic">
        Ubuntu Server 22.04 LTS · Standard_B4ls_v2 · IP público dinâmico
      </text>

      <!-- =========================================================
           3.2.1 Docker Engine + Compose
           ========================================================= -->
      <g transform="translate(20,60)">
        <rect width="620" height="520" rx="10" fill="#DCE9F5" stroke="#2B6CB0" stroke-width="1.6"/>
        <text x="14" y="24" fill="#1B5B9E" font-size="13" font-weight="700">🐳 Docker Engine + Compose plugin</text>
        <text x="14" y="42" fill="#3F4756" font-size="11" font-style="italic">Rede interna: orbital_net_rm564969 (bridge)</text>

        <!-- ===================================================
             Container APP (orbitalguard-api)
             =================================================== -->
        <g transform="translate(20,60)">
          <rect width="280" height="288" rx="10" fill="#F8F5FE" stroke="#7A5BC9" stroke-width="1.8"/>
          <text x="140" y="26" fill="#3D2B7A" font-size="13" font-weight="700" text-anchor="middle">
            ⚙ Container: orbitalguard-api
          </text>

          <!-- Info técnica -->
          <text x="140" y="52" fill="#1B2330" font-size="11" text-anchor="middle">.NET 10 + ASP.NET Core</text>
          <text x="140" y="68" fill="#1B2330" font-size="11" text-anchor="middle">EF Core 10 + Oracle EF</text>
          <text x="140" y="84" fill="#1B2330" font-size="11" text-anchor="middle">Imagem: orbitalguard-api:1.0.0</text>
          <text x="140" y="100" fill="#1B2330" font-size="11" text-anchor="middle">Build: multi-stage</text>

          <!-- Box USER -->
          <g transform="translate(20,114)">
            <rect width="240" height="32" rx="6" fill="#FCEEF3" stroke="#D14A7A" stroke-width="1.2"/>
            <text x="120" y="20" fill="#9D2050" font-size="11" font-weight="700" text-anchor="middle">
              👤 USER: orbitalapp (não-root)
            </text>
          </g>

          <!-- Box Porta -->
          <g transform="translate(20,154)">
            <rect width="240" height="32" rx="6" fill="#E8F1FB" stroke="#3B7FC9" stroke-width="1.2"/>
            <text x="120" y="20" fill="#1B5B9E" font-size="11" font-weight="700" text-anchor="middle">
              📡 Porta interna: 8080
            </text>
          </g>

          <!-- Bullets -->
          <g font-size="10" fill="#3F4756">
            <text x="20" y="208">✓ Swagger habilitado em /swagger</text>
            <text x="20" y="224">✓ Migrations automáticas + retry</text>
            <text x="20" y="240">✓ WORKDIR: /app</text>
            <text x="20" y="256">✓ Healthcheck: /health</text>
            <text x="20" y="272">✓ ENV: ASPNETCORE_URLS, TZ</text>
          </g>
        </g>

        <!-- ===================================================
             Container BANCO (oracle)
             =================================================== -->
        <g transform="translate(320,60)">
          <rect width="280" height="288" rx="10" fill="#FDF4F2" stroke="#C74634" stroke-width="1.8"/>
          <text x="140" y="26" fill="#7E2A1E" font-size="13" font-weight="700" text-anchor="middle">
            🛢 Container: orbitalguard-oracle
          </text>

          <!-- Info técnica -->
          <text x="140" y="52" fill="#1B2330" font-size="11" text-anchor="middle">gvenzl/oracle-xe:21-slim</text>
          <text x="140" y="68" fill="#1B2330" font-size="11" text-anchor="middle">Oracle Database XE 21c</text>
          <text x="140" y="84" fill="#1B2330" font-size="11" text-anchor="middle">PDB: XEPDB1</text>

          <!-- Box Schema -->
          <g transform="translate(20,114)">
            <rect width="240" height="32" rx="6" fill="#FCEEF3" stroke="#D14A7A" stroke-width="1.2"/>
            <text x="120" y="20" fill="#9D2050" font-size="11" font-weight="700" text-anchor="middle">
              👤 Schema: ORBITAL_USER
            </text>
          </g>

          <!-- Box Porta -->
          <g transform="translate(20,154)">
            <rect width="240" height="32" rx="6" fill="#E8F1FB" stroke="#3B7FC9" stroke-width="1.2"/>
            <text x="120" y="20" fill="#1B5B9E" font-size="11" font-weight="700" text-anchor="middle">
              📡 Porta interna: 1521
            </text>
          </g>

          <!-- Bullets -->
          <g font-size="10" fill="#3F4756">
            <text x="20" y="208">✓ Healthcheck habilitado</text>
            <text x="20" y="224">✓ 5 tabelas com relacionamentos:</text>
            <text x="28" y="240" fill="#7E2A1E">TB_REGIAO, TB_ALERTA, TB_USUARIO,</text>
            <text x="28" y="256" fill="#7E2A1E">TB_NOTIFICACAO, TB_USUARIO_REGIAO</text>
            <text x="20" y="272">✓ ENV: ORACLE_PASSWORD, APP_USER</text>
          </g>
        </g>

        <!-- Seta TCP 1521 entre containers -->
        <g stroke="#3F4756" stroke-width="1.6" fill="none">
          <line x1="300" y1="190" x2="320" y2="190" marker-end="url(#arrow)"/>
        </g>
        <text x="310" y="180" fill="#1B2330" font-size="10" font-weight="700" text-anchor="middle">TCP :1521</text>
        <text x="310" y="206" fill="#3F4756" font-size="9" font-style="italic" text-anchor="middle">(rede interna)</text>

        <!-- Seta persistência (container BD → volume) -->
        <g stroke="#3F4756" stroke-width="2" fill="none" marker-end="url(#arrow)">
          <line x1="460" y1="350" x2="460" y2="386"/>
        </g>
        <text x="468" y="372" fill="#1B2330" font-size="11" font-style="italic">persistência</text>

        <!-- ===================================================
             Volume nomeado (cilindro)
             =================================================== -->
        <g transform="translate(360,388)">
          <!-- Topo do cilindro -->
          <ellipse cx="100" cy="12" rx="100" ry="12" fill="#F2D4A8" stroke="#A06A28" stroke-width="1.6"/>
          <!-- Corpo -->
          <path d="M 0 12 L 0 100 Q 0 112 100 112 Q 200 112 200 100 L 200 12"
                fill="#F2D4A8" stroke="#A06A28" stroke-width="1.6"/>
          <!-- Linha de cima do corpo -->
          <ellipse cx="100" cy="12" rx="100" ry="12" fill="none" stroke="#A06A28" stroke-width="1.6"/>

          <text x="100" y="46" fill="#5A3B12" font-size="12" font-weight="700" text-anchor="middle">
            🗄 Volume nomeado
          </text>
          <text x="100" y="64" fill="#5A3B12" font-size="11" font-weight="700" text-anchor="middle">
            oracle_data_rm564969
          </text>
          <text x="100" y="82" fill="#5A3B12" font-size="10" text-anchor="middle">
            Mount: /opt/oracle/oradata
          </text>
          <text x="100" y="98" fill="#5A3B12" font-size="10" text-anchor="middle">
            Persiste dados entre restarts
          </text>
        </g>
      </g>
    </g>
  </g>

  <!-- =========================================================
       Legenda no rodapé
       ========================================================= -->
  <g transform="translate(40,1150)">
    <rect width="740" height="110" rx="10" fill="#FFFFFF" stroke="#3B7FC9" stroke-width="1.2"/>
    <text x="14" y="22" fill="#1B5B9E" font-size="12" font-weight="700">📋 Legenda - O que cada elemento faz</text>

    <g font-size="10.5" fill="#1B2330">
      <text x="14" y="42">
        <tspan fill="#1B5B9E" font-weight="700">• Usuário externo:</tspan>
        professor, banca ou aluno consumindo a API pelo IP público da VM (porta 8080/swagger).
      </text>
      <text x="14" y="58">
        <tspan fill="#1B5B9E" font-weight="700">• NSG (firewall):</tspan>
        libera apenas as portas 22 (SSH), 8080 (API/Swagger) e 1521 (Oracle externo). Bloqueia o resto.
      </text>
      <text x="14" y="74">
        <tspan fill="#1B5B9E" font-weight="700">• Azure VM:</tspan>
        Ubuntu 22.04 LTS que hospeda o Docker Engine e roda os 2 containers via docker-compose.
      </text>
      <text x="14" y="90">
        <tspan fill="#1B5B9E" font-weight="700">• Container orbitalguard-api:</tspan>
        aplicação .NET 10 ASP.NET Core rodando com usuário orbitalapp (não-root) na porta 8080.
      </text>
      <text x="14" y="106">
        <tspan fill="#1B5B9E" font-weight="700">• Volume oracle_data_rm564969:</tspan>
        persiste os dados do Oracle no host. Sobrevive a restarts e rebuilds dos containers.
      </text>
    </g>
  </g>
</svg>
